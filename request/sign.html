<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>novio sign</title>
</head>

<body>
    <iframe id="sandboxFrame" src="../sandbox.html" style="display: none;"></iframe>

    <link rel="stylesheet" href="../styles/bootstrap-icons-1.10.4/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/bootstrap.min.css">
    <link rel="stylesheet" href="../styles/flatty.css">
    <link rel="stylesheet" href="../styles/popup.css">
    <link rel="stylesheet" href="../styles/loading.css">

    <script src="../shared/pictogram.js"></script>

    <!-- Wallet Banner -->
    <div class="wallet-banner">
        <div class="wallet-info">
            <div class="wallet-identity">
                <div class="wallet-avatar" id="walletAvatar"></div>
                <div class="wallet-details">
                    <h3 id="walletName">Novio Wallet</h3>
                    <p class="wallet-address" id="walletAddress">0x1234...5678</p>
                </div>
            </div>
            <div class="badge" id="txBadge">Sign</div>
        </div>
    </div>

    <div class="container" style="padding-top: 16px;">
        <div id="signData"></div>
        The website has requested you to sign a message.<br>
        Note: this will allow the website to learn your public key.

        <div class="py-3">
            <button class="btn btn-outline-primary" style="width: 100%;" type="button" id="signConfirm" disabled>Confirm</button>
        </div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="loading-text">Loading...</div>
    </div>

    <script src="../shared/crypto-aes-gcm.js"></script>
    <script src="../shared/util.js"></script>
    <script src="../library/bootstrap.bundle.min.js"></script>
    <script src="../library/humane.js"></script>
    <script src="./sign_script.js"></script>
</body>

</html>
